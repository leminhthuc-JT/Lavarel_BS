<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Đặt lại mật khẩu | The Little Prince Pâtisserie
    </title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>


<body>

<main class="auth-page">


    <section class="auth-showcase">

        <div class="showcase-overlay"></div>


        <a href="../home/index.html" class="brand">

            <img
                src="../../assets/logo.png"
                alt="The Little Prince Pâtisserie"
                class="brand-logo-image"
            >

        </a>


        <div class="showcase-content">

            <h1>
                Một khởi đầu<br>
                <em>mới.</em>
            </h1>

            <p>
                Chọn một mật khẩu mới cho tài khoản của bạn.
            </p>

        </div>


        <div class="showcase-signature">

            <span></span>

            <small>L · P</small>

            <span></span>

        </div>

    </section>



    <section class="auth-panel">

        <div class="auth-container">


            <header class="auth-header">

                <span class="section-label">
                    NOUVEAU MOT DE PASSE
                </span>

                <h2>
                    Tạo mật khẩu mới.
                </h2>

                <p>
                    Mật khẩu cần có ít nhất 6 ký tự.
                </p>

            </header>


            <form
                id="resetPasswordForm"
                class="auth-form"
            >


                <div class="form-group">

                    <label for="newPassword">
                        Mật khẩu mới
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Tối thiểu 6 ký tự"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="newPassword"
                            aria-label="Hiện mật khẩu"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <div class="form-group">

                    <label for="confirmNewPassword">
                        Xác nhận mật khẩu
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmNewPassword"
                            placeholder="Nhập lại mật khẩu"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmNewPassword"
                            aria-label="Hiện mật khẩu"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div
                    id="resetPasswordMessage"
                    class="form-message"
                ></div>


                <button
                    type="submit"
                    class="primary-button"
                >

                    <span>Đổi mật khẩu</span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>


            <div class="back-login">

                <a href="login.html">
                    ← Quay lại đăng nhập
                </a>

            </div>

        </div>

    </section>

</main>


<script src="auth.js?v=999"></script>

</body>
</html>
