<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Đăng ký | The Little Prince Pâtisserie
    </title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="auth.css"
    >
<script
    src="https://accounts.google.com/gsi/client"
    async
    defer
></script>
</head>


<body>


<main class="auth-page">


    <!-- LEFT BANNER -->
    <section class="auth-showcase register-showcase">

        <div class="showcase-overlay"></div>


        <!-- LOGO -->
        <a href="../home/index.html" class="brand">
            <img
                src="../../assets/logo.png"
                alt="The Little Prince Pâtisserie"
                class="brand-logo-image"
            >
        </a>



        <!-- CONTENT -->
        <div class="showcase-content">

            

            <h1>
                Thêm một chút<br>
                <em>ngọt ngào.</em>
            </h1>

            <p>
                Tạo tài khoản và lưu lại những chiếc bánh
                bạn yêu thích.
            </p>

        </div>



        <div class="showcase-signature">

            <span></span>

            <small>
                L · P
            </small>

            <span></span>

        </div>

    </section>



    <!-- RIGHT -->
    <section class="auth-panel">

        <div class="auth-container register-container">


            <!-- MOBILE LOGO -->
            <a href="../home/index.html" class="mobile-brand">
                <img
                    src="../../assets/logo.png"
                    alt="The Little Prince Pâtisserie"
                    class="mobile-logo-image"
                >
            </a>


            <!-- HEADER -->
            <header class="auth-header">

                <span class="section-label">
                    BIENVENUE
                </span>

                <h2>
                    Tạo tài khoản.
                </h2>

                <p>

                    Đã là thành viên?

                    <a href="login.html">
                        Đăng nhập
                    </a>

                </p>

            </header>



            <!-- GOOGLE -->
            <div class="google-login-wrapper">
    <div id="googleRegisterButton"></div>
</div>



            <div class="divider">

                <span>
                    hoặc đăng ký bằng email
                </span>

            </div>



            <!-- FORM -->
            <form
                id="registerForm"
                class="auth-form"
            >


                <div class="form-group">

                    <label for="fullName">
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Nguyễn Văn A"
                        autocomplete="name"
                        required
                    >

                    <small class="error-message"></small>

                </div>



                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="ban@example.com"
                        autocomplete="email"
                        required
                    >

                    <small class="error-message"></small>

                </div>



                <div class="form-group">

                    <label for="registerPassword">
                        Mật khẩu
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Tối thiểu 6 ký tự"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="registerPassword"
                            aria-label="Hiện mật khẩu"
                        >

                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <path
                                    d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                            </svg>

                        </button>

                    </div>


                    <small class="error-message"></small>

                </div>



                <div class="form-group">

                    <label for="confirmPassword">
                        Xác nhận mật khẩu
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Nhập lại mật khẩu"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword"
                            aria-label="Hiện mật khẩu"
                        >

                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                            >

                                <path
                                    d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                            </svg>

                        </button>

                    </div>


                    <small class="error-message"></small>

                </div>



                <label class="remember agreement">

                    <input
                        type="checkbox"
                        id="agreeTerms"
                        required
                    >

                    <span>

                        Tôi đồng ý với

                        <a href="#">
                            Điều khoản sử dụng
                        </a>

                        và

                        <a href="#">
                            Chính sách bảo mật
                        </a>.

                    </span>

                </label>



                <div
                    id="registerMessage"
                    class="form-message"
                ></div>



                <button
                    type="submit"
                    class="primary-button"
                >

                    <span>
                        Tạo tài khoản
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>

        </div>

    </section>

</main>


<script src="auth.js"></script>


</body>
</html>
