<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập | The Little Prince Pâtisserie</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="auth.css">
    <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
></script>
</head>

<body>

<main class="auth-page">

    <!-- =========================
         LEFT BANNER
    ========================== -->
    <section class="auth-showcase">

        <div class="showcase-overlay"></div>

        <!-- LOGO -->
        <a href="../home/index.html" class="brand">
            <img
                src="../../assets/logo.png"
                alt="The Little Prince Pâtisserie"
                class="brand-logo-image"
            >
        </a>

        <!-- MAIN TEXT -->
        <div class="showcase-content">

            

            <h1>
                Một chút<br>
                <em>ngọt ngào.</em>
            </h1>

            <p>
                Những chiếc bánh nhỏ cho những ngày thật đẹp.
            </p>

        </div>

        <!-- BOTTOM DECORATION -->
        <div class="showcase-signature">
            <span></span>
            <small>L · P</small>
            <span></span>
        </div>

    </section>


    <!-- =========================
         RIGHT FORM
    ========================== -->
    <section class="auth-panel">

        <div class="auth-container">

            <!-- MOBILE LOGO -->
            <a href="../home/index.html" class="mobile-brand">
                <img
                    src="../../assets/logo.png"
                    alt="The Little Prince Pâtisserie"
                    class="mobile-logo-image"
                >
            </a>


            <!-- HEADER -->
            <header class="auth-header">

                <span class="section-label">
                    BON RETOUR
                </span>

                <h2>
                    Chào mừng trở lại.
                </h2>

                <p>
                    Chưa có tài khoản?
                    <a href="register.html">
                        Đăng ký ngay
                    </a>
                </p>

            </header>


            <!-- GOOGLE -->
            <div class="google-login-wrapper">
    <div id="googleLoginButton"></div>
</div>


            <!-- DIVIDER -->
            <div class="divider">
                <span>hoặc đăng nhập bằng email</span>
            </div>


            <!-- FORM -->
            <form id="loginForm" class="auth-form">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="ban@example.com"
                        autocomplete="email"
                        required
                    >

                    <small class="error-message"></small>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <div class="label-row">

                        <label for="loginPassword">
                            Mật khẩu
                        </label>

                        <a
    href="forgot-password.html"
    class="forgot-password"
>
    Quên mật khẩu?
</a>

                    </div>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="loginPassword"
                            aria-label="Hiện mật khẩu"
                        >

                            <svg
                                class="eye-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                            >
                                <path
                                    d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />
                            </svg>

                        </button>

                    </div>

                    <small class="error-message"></small>

                </div>


                <!-- REMEMBER -->
                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Ghi nhớ đăng nhập
                    </span>

                </label>


                <div
                    id="loginMessage"
                    class="form-message"
                ></div>


                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="primary-button"
                >

                    <span>Đăng nhập</span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>


            <!-- TERMS -->
            <p class="terms">

                Bằng việc tiếp tục, bạn đồng ý với

                <a href="#">
                    Điều khoản sử dụng
                </a>

                và

                <a href="#">
                    Chính sách bảo mật
                </a>.

            </p>

        </div>

    </section>

</main>

<script src="auth.js"></script>

</body>
</html>
